# Paquetes del servidor web (con las extensiones de PHP de todas las
# aplicaciones que ofrece el hosting)
paquetes_web:
  - apache2
  - php
  - libapache2-mod-php
  - php-mysql
  - php-mbstring
  - php-xml
  - php-curl
  - php-gd
  - php-intl
  - php-zip
  - mariadb-client

# Directorios del hosting
hosting_dir: /var/www/clientes       # aquí se monta el directorio de cada cliente
hosting_pagina_dir: /var/www/hosting # página por defecto del hosting

# Opciones de montaje NFS de los directorios de los clientes
nfs_opciones: rw,hard,noatime,_netdev
