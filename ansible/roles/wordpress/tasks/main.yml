# Se ejecuta en el NAS: WordPress se descarga una vez y se descomprime en el
# espacio de cada cliente. Las extensiones de PHP se instalan en web
# (group_vars/servidores_web.yaml), que es donde se ejecuta PHP.

- name: Descargar WordPress una sola vez para todos los clientes
  ansible.builtin.get_url:
    url: "{{ wordpress_url }}"
    dest: "{{ wordpress_paquete }}"
    mode: "0644"
  when: clientes_wordpress | length > 0

- name: Descomprimir WordPress en el espacio de cada cliente (solo la primera vez)
  ansible.builtin.unarchive:
    src: "{{ wordpress_paquete }}"
    dest: "{{ nas_export_dir }}/{{ item.nombre }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "{{ nas_export_dir }}/{{ item.nombre }}/wp-settings.php"
    owner: "{{ item.nombre }}"
    group: www-data
  loop: "{{ clientes_wordpress }}"
  loop_control:
    label: "{{ item.nombre }}"

- name: Generar el wp-config.php de cada cliente
  ansible.builtin.template:
    src: wp-config.php.j2
    dest: "{{ nas_export_dir }}/{{ item.nombre }}/wp-config.php"
    owner: "{{ item.nombre }}"
    group: www-data
    mode: "0640"
  loop: "{{ clientes_wordpress }}"
  loop_control:
    label: "{{ item.nombre }}"

# Apache (www-data) tiene que poder escribir en wp-content para guardar las
# imágenes que se suben al blog.
- name: wp-content con permiso de escritura para el grupo www-data
  ansible.builtin.file:
    path: "{{ nas_export_dir }}/{{ item.nombre }}/wp-content"
    state: directory
    owner: "{{ item.nombre }}"
    group: www-data
    mode: "2770"
  loop: "{{ clientes_wordpress }}"
  loop_control:
    label: "{{ item.nombre }}"
