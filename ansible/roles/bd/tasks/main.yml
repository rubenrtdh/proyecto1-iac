- name: Instalar MariaDB y la librería de Python que usa Ansible para gestionarla
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present

- name: Hacer que MariaDB escuche solo en la red de datos
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address'
    line: "bind-address = {{ ip_datos_bd }}"
  notify: Reiniciar MariaDB

- name: MariaDB arrancado y activo al inicio
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

# ---------- Alta de clientes ----------

- name: Crear la base de datos de cada cliente
  community.mysql.mysql_db:
    name: "{{ item.nombre }}"
    state: present
    login_unix_socket: "{{ mysql_socket }}"
  loop: "{{ clientes_alta }}"
  loop_control:
    label: "{{ item.nombre }}"

- name: Crear el usuario de cada cliente (solo su base de datos y solo desde web)
  community.mysql.mysql_user:
    name: "{{ item.nombre }}_user"
    password: "{{ vault_secretos[item.nombre].db_password }}"
    host: "{{ ip_datos_web }}"
    priv: "{{ item.nombre }}.*:ALL"
    state: present
    login_unix_socket: "{{ mysql_socket }}"
  loop: "{{ clientes_alta }}"
  loop_control:
    label: "{{ item.nombre }}_user@{{ ip_datos_web }}"

# ---------- Tablas de los clientes con guestbook ----------

- name: Descargar schema.sql del guestbook
  ansible.builtin.get_url:
    url: "{{ schema_url }}"
    dest: "{{ schema_dest }}"
    mode: "0644"
  when: clientes_guestbook | length > 0

- name: Comprobar si la tabla messages ya existe en cada guestbook
  community.mysql.mysql_query:
    login_db: "{{ item.nombre }}"
    query: "SHOW TABLES LIKE 'messages'"
    login_unix_socket: "{{ mysql_socket }}"
  loop: "{{ clientes_guestbook }}"
  loop_control:
    label: "{{ item.nombre }}"
  register: tablas
  changed_when: false

- name: Crear las tablas del guestbook (solo si todavía no existen)
  community.mysql.mysql_db:
    name: "{{ item.item.nombre }}"
    state: import
    target: "{{ schema_dest }}"
    login_unix_socket: "{{ mysql_socket }}"
  loop: "{{ tablas.results }}"
  loop_control:
    label: "{{ item.item.nombre }}"
  when: item.rowcount[0] == 0

# ---------- Baja de clientes ----------

- name: Borrar el usuario de los clientes de baja
  community.mysql.mysql_user:
    name: "{{ item.nombre }}_user"
    host: "{{ ip_datos_web }}"
    state: absent
    login_unix_socket: "{{ mysql_socket }}"
  loop: "{{ clientes_baja }}"
  loop_control:
    label: "{{ item.nombre }}_user@{{ ip_datos_web }}"

- name: Borrar la base de datos de los clientes de baja
  community.mysql.mysql_db:
    name: "{{ item.nombre }}"
    state: absent
    login_unix_socket: "{{ mysql_socket }}"
  loop: "{{ clientes_baja }}"
  loop_control:
    label: "{{ item.nombre }}"
