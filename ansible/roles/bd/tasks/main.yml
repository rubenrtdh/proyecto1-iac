- name: Instalar MariaDB y la librería de Python que usa Ansible para gestionarla
  ansible.builtin.apt:
    name:
      - mariadb-server
      - python3-pymysql
    state: present

- name: Hacer que MariaDB escuche solo en la red de datos
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address'
    line: "bind-address = {{ ip_datos_bd }}"
  notify: Reiniciar MariaDB

- name: MariaDB arrancado y activo al inicio
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Crear la base de datos
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: "{{ mysql_socket }}"

- name: Crear el usuario, que solo puede conectarse desde web por la red de datos
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    host: "{{ ip_datos_web }}"
    priv: "{{ db_name }}.*:ALL"
    state: present
    login_unix_socket: "{{ mysql_socket }}"

- name: Descargar schema.sql de la aplicación
  ansible.builtin.get_url:
    url: "{{ schema_url }}"
    dest: "{{ schema_dest }}"
    mode: "0644"

- name: Comprobar si la tabla messages ya existe
  community.mysql.mysql_query:
    login_db: "{{ db_name }}"
    query: "SHOW TABLES LIKE 'messages'"
    login_unix_socket: "{{ mysql_socket }}"
  register: tabla
  changed_when: false

- name: Crear las tablas (solo si todavía no existen)
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: "{{ schema_dest }}"
    login_unix_socket: "{{ mysql_socket }}"
  when: tabla.rowcount[0] == 0
